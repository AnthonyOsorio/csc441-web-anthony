<!-- Class 16: Step 2: a form -->
 <body>
    <!-- Class 18: Step 1: let Netlify handle the submmission -->
    <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/thanks.html">
        <p class="hidden-field">
            <label>Leave this empty: <input name="bot-field" type="text"></label>

        </p>
        

    <p>
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" required>
    </p>

    <p>
        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required>
    </p>

    <p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <p id="char-count">0 characters</p>
    </p>

    <p>
        <button type="submit">Send</button>
    </p>
</form>

<p id="form-status" role="status"></p>
